[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "keyless-web-mcp"
version = "0.1.0"
description = "Zero-config MCP server for web search and page reading: no API keys, no sign-up."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ai-v5 contributors" }]
keywords = ["mcp", "model-context-protocol", "web-search", "web-fetch", "scraping", "llm"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
  "Typing :: Typed",
]
dependencies = [
  "mcp>=2.3,<3",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "trafilatura>=1.8",
  "truststore>=0.10",
]

[project.urls]
Homepage = "https://github.com/ai-v5/keyless-web-mcp"
Repository = "https://github.com/ai-v5/keyless-web-mcp"
Issues = "https://github.com/ai-v5/keyless-web-mcp/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.10",
]

[project.scripts]
keyless-web-mcp = "keyless_web.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/keyless_web"]

[tool.hatch.build.targets.sdist]
include = ["src/keyless_web", "tests", "README.md", "README.zh-CN.md", "LICENSE", "SECURITY.md", "CONTRIBUTING.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::DeprecationWarning:keyless_web.*"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
strict = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["trafilatura.*", "truststore.*"]
ignore_missing_imports = true
